<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fake YouTube archive player</title>
  </head>
  <body>
    <!-- Mimics the parts of YouTube's player the add-on reads for an archived stream: the
         position (which moves at the playback rate), the broadcast start time, seeking,
         pause/play, and the media events a real video element fires. -->
    <div id="movie_player"><video></video></div>
    <script>
      const params = new URLSearchParams(location.search);
      const player = document.getElementById("movie_player");
      const video = player.querySelector("video");
      const start = params.get("start");
      const STEP = 0.1;
      // Seconds of video downloaded per second; streams can buffer at different speeds.
      const loadRate = Number(params.get("load") ?? "4");
      let position = Number(params.get("position") ?? "0");
      let buffer = 30;
      let stateCode = 1;
      let wantsToPlay = true;

      // The element has no media, so position and buffer are kept here and reported through it.
      Object.defineProperty(video, "currentTime", {
        get: () => position,
        set: (value) => (position = value),
      });
      Object.defineProperty(video, "buffered", {
        get: () => ({ length: 1, start: () => position, end: () => position + buffer }),
      });
      setInterval(() => {
        buffer = Math.min(30, buffer + loadRate * STEP);
        if (stateCode === 3 && buffer >= 1) {
          stateCode = 1;
        }
        if (stateCode === 1) {
          const step = Math.min(video.playbackRate * STEP, buffer);
          position += step;
          buffer -= step;
          stateCode = buffer <= 0 ? 3 : 1;
        }
      }, STEP * 1000);

      function fire(name) {
        video.dispatchEvent(new Event(name));
      }

      Object.assign(player, {
        getStatsForNerds: () => ({}),
        getPlayerState: () => stateCode,
        getVideoData: () => ({
          isLive: false,
          title: params.get("title") ?? "Fake archive",
          author: "Fake channel",
          video_id: location.pathname.split("/").pop(),
        }),
        getPlayerResponse: () => ({
          videoDetails: { isLiveContent: true },
          microformat: start
            ? { playerMicroformatRenderer: { liveBroadcastDetails: { startTimestamp: start } } }
            : undefined,
        }),
        getDuration: () => 20000,
        seekTo: (seconds) => {
          position = seconds;
          buffer = 0;
          stateCode = wantsToPlay ? 3 : 2;
          fire("seeked");
        },
        playVideo: () => {
          wantsToPlay = true;
          stateCode = buffer >= 1 ? 1 : 3;
          fire("play");
        },
        pauseVideo: () => {
          wantsToPlay = false;
          stateCode = 2;
          fire("pause");
        },
      });
      // What a user does on this player, for tests.
      window.fakeUser = {
        seek: (seconds) => player.seekTo(seconds),
        pause: () => player.pauseVideo(),
        play: () => player.playVideo(),
      };
      window.fakePosition = () => position;
      window.fakeState = () => stateCode;
    </script>
  </body>
</html>
