name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A zip of the built add-on on its GitHub release, for installing it by hand.
  zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          (cd dist && zip -r "../yt-stream-sync-$VERSION.zip" .)
          gh release upload "$TAG" "yt-stream-sync-$VERSION.zip"
      # Submits the version for Mozilla's review and returns without waiting (review can take
      # days). AMO needs the source of bundled add-ons: a git archive of the release tag, with
      # build steps for the reviewer in .github/amo-metadata.json.
      - name: Publish to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          SOURCE_ZIP="$RUNNER_TEMP/yt-stream-sync-source.zip"
          git archive --format=zip --output="$SOURCE_ZIP" HEAD
          npx web-ext sign --channel=listed --approval-timeout=0 \
            --source-dir=dist --artifacts-dir="$RUNNER_TEMP/web-ext" \
            --upload-source-code="$SOURCE_ZIP" --amo-metadata=.github/amo-metadata.json
